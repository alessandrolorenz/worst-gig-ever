# Publishes the privacy policy to GitHub Pages.
#
# Only `site/` is uploaded. The rest of the repository — specs, ADRs, gate
# reports, art provenance — stays private to the repository, which is why this
# deploys an artifact rather than serving a branch or the `docs/` folder.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running deploy; queue behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages must be enabled on the repository once, out of band, before this
      # step can find a site to configure:
      #
      #   gh api -X POST repos/<owner>/<repo>/pages -f build_type=workflow
      #
      # `enablement: true` looks like it removes that step and does not:
      # creating a Pages site needs admin rights, and GITHUB_TOKEN never has
      # them, so the run fails with "Resource not accessible by integration".
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
